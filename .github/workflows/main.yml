name: CI

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/main.yml
      - packages/**/*.{js,ts,json}
      - tools/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 20 # April 30, 2026
          - 22 # April 30, 2027
          - 24 # 2027-06-16
          - latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-deps
      with:
        node-version: ${{ matrix.node }}
    - name: Verify workspace in release form
      run: sh tools/verify.sh
    - name: Save package-level verification summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verify-summary-node-${{ matrix.node }}
        path: .verify/summary.json
        if-no-files-found: error
        retention-days: 14
