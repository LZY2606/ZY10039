name: CI

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/main.yml
      - packages/**/*.{js,ts,json}
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tools/**
      - VERIFYING.md
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 20
          - 22
          - 24
          - latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-deps
      with:
        node-version: ${{ matrix.node }}
    - name: Unified release-shape verification
      run: sh tools/verify.sh
      env:
        CI: 'true'
    - name: Upload package-level verify summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verify-summary-node-${{ matrix.node }}
        path: |
          .verify/summary.json
          .verify/logs/
        if-no-files-found: warn
